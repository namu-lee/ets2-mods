name: Publish a mod

on:
  workflow_call:
    inputs:
      mod:
        type: string
        required: true
      release_tag:
        type: string
        default: ''
      package_version:
        type: string
        default: ''
      workshop_item_id:
        type: string
        required: true
      artifact_prefix:
        type: string
        default: ''
      workshop_first:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  github-release:
    if: ${{ !cancelled() && inputs.release_tag != '' && (!inputs.workshop_first || inputs.workshop_item_id == '' || needs.workshop-upload.result == 'success') }}
    needs: workshop-upload
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build the mod
        id: package
        env:
          MOD: ${{ inputs.mod }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          $versionArguments = @()
          if ($env:PACKAGE_VERSION) { $versionArguments = @('--version', $env:PACKAGE_VERSION) }
          $package = python scripts/build.py "mods/$env:MOD" @versionArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$package" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}scs-package
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          overwrite: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE: ${{ steps.package.outputs.path }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
        run: |
          . .\.github\scripts\release-notes.ps1
          $message = Get-ReleaseTagMessage $env:RELEASE_TAG
          $releases = gh api --paginate "repos/$env:GH_REPO/releases?per_page=100" --jq '.[] | [.tag_name, .draft] | @tsv'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ("$env:RELEASE_TAG`tfalse" -in $releases) {
              Write-Host "$env:RELEASE_TAG is already published."
              exit 0
          }
          if ($env:ARTIFACT_PREFIX -and "$env:RELEASE_TAG`ttrue" -in $releases) {
              gh release upload "$env:RELEASE_TAG" "$env:PACKAGE" --clobber
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              gh release edit "$env:RELEASE_TAG" --draft=false
              exit $LASTEXITCODE
          }
          $releaseNotes = @('--generate-notes')
          if (-not [string]::IsNullOrWhiteSpace($message)) {
              $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
              Set-Content -LiteralPath $notesFile -Value $message -Encoding utf8NoBOM -NoNewline
              $releaseNotes = @('--notes-file', $notesFile)
          }
          gh release create "$env:RELEASE_TAG" "$env:PACKAGE" --verify-tag --title "$env:RELEASE_TAG" @releaseNotes

  workshop-package:
    if: inputs.release_tag == '' || inputs.workshop_item_id != ''
    runs-on: windows-2025
    outputs:
      archive: ${{ steps.package.outputs.archive }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Workshop build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build the Workshop ZIP
        id: package
        env:
          MOD: ${{ inputs.mod }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          WORKSHOP_ARCHIVE: ${{ inputs.artifact_prefix }}workshop-package.zip
        run: |
          $versionArguments = @()
          if ($env:PACKAGE_VERSION) { $versionArguments = @('--version', $env:PACKAGE_VERSION) }
          $archive = python scripts/build_workshop.py "mods/$env:MOD" @versionArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archiveName = $env:WORKSHOP_ARCHIVE
          if ([int]$env:GITHUB_RUN_ATTEMPT -gt 1) {
              $archiveName = "$($archiveName -replace '\.zip$', '')-$env:GITHUB_RUN_ATTEMPT.zip"
          }
          if ((Split-Path -Leaf $archive) -ne $archiveName) {
              Rename-Item -LiteralPath $archive -NewName $archiveName
          }
          "archive=$archiveName" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        with:
          path: build/${{ inputs.mod }}/${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error

  workshop-upload:
    if: inputs.release_tag != '' && inputs.workshop_item_id != ''
    needs: workshop-package
    runs-on: windows-2025
    environment: steam-workshop
    timeout-minutes: 5
    concurrency: steam-workshop-${{ inputs.workshop_item_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install description converter
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.workshop-package.outputs.archive }}
          path: ${{ runner.temp }}
          skip-decompress: true
      - name: Prepare the Workshop update
        env:
          GH_TOKEN: ${{ github.token }}
          ITEM_ID: ${{ inputs.workshop_item_id }}
          MOD: ${{ inputs.mod }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKSHOP_ARCHIVE: ${{ needs.workshop-package.outputs.archive }}
        run: |
          function ConvertTo-VdfValue([string]$value) {
              # SteamCMD reads backslashes literally. Use a visible quote that cannot close the VDF value.
              $quoted = $value.Replace('"', [string][char]0xFF02)
              return $quoted -replace '\r\n?', "`n"
          }

          $archive = Join-Path $env:RUNNER_TEMP $env:WORKSHOP_ARCHIVE
          $unpacked = Join-Path $env:RUNNER_TEMP 'workshop-package'
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          $content = (Resolve-Path -LiteralPath (Join-Path $unpacked 'workshop')).ProviderPath
          if (-not (Test-Path -LiteralPath (Join-Path $content 'versions.sii') -PathType Leaf)) {
              throw 'The Workshop package is missing versions.sii.'
          }

          . .\.github\scripts\release-notes.ps1
          $message = Get-ReleaseTagMessage $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($message)) {
              $message = "Release $env:RELEASE_TAG"
          }
          $descriptionFile = Join-Path $env:RUNNER_TEMP 'workshop-description.txt'
          python -c @'
          from pathlib import Path
          from sys import argv

          from scripts.build import render_description

          description = render_description(Path(argv[1]), to="bbcode_steam")
          Path(argv[2]).write_text(description, encoding="utf-8", newline="\n")
          '@ "mods/$env:MOD/description.md" "$descriptionFile"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $description = (Get-Content -Raw -Encoding utf8 -LiteralPath $descriptionFile).TrimEnd("`r`n".ToCharArray())

          $workshopDescription = ConvertTo-VdfValue $description
          $changeNote = ConvertTo-VdfValue $message
          $vdfContentPath = ConvertTo-VdfValue $content
          $vdf = Join-Path $env:RUNNER_TEMP 'workshop-update.vdf'
          @"
          "workshopitem"
          {
              "appid"           "227300"
              "publishedfileid" "$env:ITEM_ID"
              "contentfolder"   "$vdfContentPath"
              "description"     "$workshopDescription"
              "changenote"      "$changeNote"
          }
          "@ | Set-Content -LiteralPath $vdf -Encoding utf8NoBOM
      - name: Install SteamCMD
        run: |
          . .\.github\scripts\steamcmd.ps1
          Install-SteamCmd
      - name: Update the Workshop item
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
        run: |
          . .\.github\scripts\steamcmd.ps1
          Publish-SteamWorkshopItem -WorkshopVdf (Join-Path $env:RUNNER_TEMP 'workshop-update.vdf')
