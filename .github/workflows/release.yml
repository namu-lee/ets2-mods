name: Release a mod

on:
  push:
    tags: ['*/v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      mod:
        description: Mod directory name under mods/ to package for Workshop
        type: string
        required: true

permissions:
  contents: read

jobs:
  select:
    if: ${{ !github.event.deleted }}
    runs-on: windows-2025
    outputs:
      mod: ${{ steps.mod.outputs.mod }}
      workshop_item_id: ${{ steps.mod.outputs.workshop_item_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select the mod
        id: mod
        env:
          REQUESTED_MOD: ${{ inputs.mod }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
              if ($env:GITHUB_REF_NAME -cnotmatch '^(?<mod>[a-z0-9]+(?:-[a-z0-9]+)*)/v[0-9]+\.[0-9]+\.[0-9]+$') {
                  throw 'Use a tag such as no-minimap/v0.0.2.'
              }
              $mod = $Matches.mod
          } else {
              $mod = $env:REQUESTED_MOD
              if ($mod -cnotmatch '^[a-z0-9]+(?:-[a-z0-9]+)*$') {
                  throw 'Enter a mod directory name, such as no-minimap.'
              }
          }

          $configPath = "mods/$mod/mod.json"
          if (-not (Test-Path -LiteralPath $configPath -PathType Leaf)) {
              throw "Unknown mod '$mod'."
          }
          $config = Get-Content -Raw -LiteralPath $configPath | ConvertFrom-Json
          $itemId = [string]$config.workshop_item_id
          if ($itemId) {
              [uint64]$id = 0
              if ($itemId -notmatch '^[0-9]+$' -or -not [uint64]::TryParse($itemId, [ref]$id) -or $id -eq 0) {
                  throw "Set workshop_item_id in $configPath to an existing Workshop item ID."
              }
          }
          "mod=$mod" >> $env:GITHUB_OUTPUT
          "workshop_item_id=$itemId" >> $env:GITHUB_OUTPUT

  release:
    needs: select
    concurrency:
      group: >-
        ${{ github.event_name == 'push' && format('mod-release-{0}', needs.select.outputs.mod)
          || format('mod-package-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-mod.yml
    with:
      mod: ${{ needs.select.outputs.mod }}
      workshop_item_id: ${{ needs.select.outputs.workshop_item_id }}
