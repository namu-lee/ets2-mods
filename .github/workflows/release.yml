name: Release a mod

on:
  push:
    tags: ['*/v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      mod:
        description: Mod directory name under mods/ to package for Workshop
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'mod-releases' || format('mod-package-{0}', github.run_id) }}
  queue: max

jobs:
  select:
    if: ${{ !github.event.deleted }}
    runs-on: windows-2025
    outputs:
      mod: ${{ steps.mod.outputs.mod }}
      workshop_item_id: ${{ steps.mod.outputs.workshop_item_id }}
      release_tag: ${{ steps.mod.outputs.release_tag }}
      package_version: ${{ steps.mod.outputs.package_version }}
      workshop_first: ${{ steps.mod.outputs.workshop_first }}
      variants: ${{ steps.mod.outputs.variants }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select the mod
        id: mod
        env:
          REQUESTED_MOD: ${{ inputs.mod }}
        run: |
          $releaseTag = ''
          $tagVersion = ''
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
              if ($env:GITHUB_REF_NAME -cnotmatch '^(?<mod>[a-z0-9]+(?:-[a-z0-9]+)*)/v(?<version>[0-9]+\.[0-9]+\.[0-9]+)$') {
                  throw 'Use a tag such as no-minimap/v0.0.2.'
              }
              $mod = $Matches.mod
              $releaseTag = $env:GITHUB_REF_NAME
              $tagVersion = $Matches.version
          } else {
              $mod = $env:REQUESTED_MOD
              if ($mod -cnotmatch '^[a-z0-9]+(?:-[a-z0-9]+)*$') {
                  throw 'Enter a mod directory name, such as no-minimap.'
              }
          }

          $configPath = "mods/$mod/mod.json"
          if (-not (Test-Path -LiteralPath $configPath -PathType Leaf)) {
              throw "Unknown mod '$mod'."
          }
          $config = Get-Content -Raw -LiteralPath $configPath | ConvertFrom-Json
          $releaseWithSource = $config.release_with_source -is [bool] -and $config.release_with_source
          $packageVersion = if ($releaseWithSource) { $tagVersion } else { '' }
          $itemId = [string]$config.workshop_item_id
          if ($itemId) {
              [uint64]$id = 0
              if ($itemId -notmatch '^[0-9]+$' -or -not [uint64]::TryParse($itemId, [ref]$id) -or $id -eq 0) {
                  throw "Set workshop_item_id in $configPath to an existing Workshop item ID."
              }
          }
          $variants = @(if ($releaseTag) {
              foreach ($directory in Get-ChildItem -LiteralPath 'mods' -Directory) {
                  $path = Join-Path $directory.FullName 'mod.json'
                  if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { continue }
                  $variant = Get-Content -Raw -LiteralPath $path | ConvertFrom-Json
                  if ($variant.source_mod -ceq $mod -and $variant.release_with_source -is [bool] -and $variant.release_with_source) {
                      $directory.Name
                  }
              }
          })
          "mod=$mod" >> $env:GITHUB_OUTPUT
          "workshop_item_id=$itemId" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "workshop_first=$($releaseWithSource.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "variants=$(ConvertTo-Json -InputObject $variants -Compress)" >> $env:GITHUB_OUTPUT

  release:
    needs: select
    permissions:
      contents: write
    uses: ./.github/workflows/publish-mod.yml
    with:
      mod: ${{ needs.select.outputs.mod }}
      workshop_item_id: ${{ needs.select.outputs.workshop_item_id }}
      release_tag: ${{ needs.select.outputs.release_tag }}
      package_version: ${{ needs.select.outputs.package_version }}
      workshop_first: ${{ fromJSON(needs.select.outputs.workshop_first) }}
    secrets: inherit

  plan-variants:
    needs: select
    if: github.event_name == 'push' && needs.select.outputs.variants != '[]'
    runs-on: windows-2025
    permissions:
      contents: write
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install release dependencies
        run: python -m pip install -r requirements.txt
      - name: Compare variant packages and reserve versions for changes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
          RELEASE_VARIANTS: ${{ needs.select.outputs.variants }}
        run: python scripts/sync_releases.py

  release-variants:
    needs: plan-variants
    if: needs.plan-variants.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-variants.outputs.releases) }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-mod.yml
    with:
      mod: ${{ matrix.mod }}
      workshop_item_id: ${{ matrix.workshop_item_id }}
      release_tag: ${{ matrix.tag }}
      package_version: ${{ matrix.version }}
      artifact_prefix: ${{ matrix.mod }}-
      workshop_first: true
    secrets: inherit
